timezone: Asia/Shanghai
# IDLE renewal and catch-up interval, capped internally at five minutes.
poll_seconds: 300

accounts:
  - id: personal
    connector: imap
    enabled: true
    host: imap.example.com
    port: 993
    username: you@example.com
    password_env: MAILSENTRY_PERSONAL_PASSWORD
    folder: INBOX
    tls: true

classification:
  immediate_threshold: 80
  digest_threshold: 50
  allow_senders:
    - boss@example.com
    - "@trusted.example"
  deny_senders: []
  # Exact sender entries override matching @domain entries; values are -30 to 30.
  sender_reputation:
    billing@example.com: 20
    "@newsletters.example": -10
  # Optional OpenAI Responses-compatible provider. DeepSeek is shown as an example.
  # Keep the actual key in .env, never in this YAML file.
  cloud:
    enabled: false
    base_url: https://api.deepseek.com
    model: deepseek-flash
    api_key_env: MAILSENTRY_CLOUD_API_KEY
    timeout_seconds: 15
  important_keywords:
    - urgent
    - deadline
    - invoice
    - security alert
    - 紧急
    - 截止
    - 账单
    - 安全提醒
  important_attachment_extensions:
    - .pdf
    - .docx
    - .xlsx

notifications:
  urls_env: MAILSENTRY_APPRISE_URLS
  digest_times:
    - "09:00"
    - "18:00"

storage:
  path: data/mailsentry.db
  retention_days: 30
