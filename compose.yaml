services:
  mailsentry:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - mailsentry-data:/app/data
    command: ["run", "--config", "/config/config.yaml"]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m

volumes:
  mailsentry-data:
